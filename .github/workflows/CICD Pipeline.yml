name: CI-CD Pipeline

permissions:
  contents: read
  packages: write
  
on:
  push:
    paths:
      - 'src/Api/**'
      - 'src/Message/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore Platform.sln
    
    - name: Build
      run: dotnet build Platform.sln --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test Platform.sln --no-build --configuration Release --verbosity normal

  build-and-publish-api:
    needs: test
    uses: AcmeTickets/.github/.github/workflows/Build and Publish Docker Image.yml@main
    secrets: inherit
    with:
      project_path: src/Api/Api.csproj
      dockerfile_path: src/Api/Dockerfile
      image_name: ghcr.io/acmetickets/platform-api

  deploy-api:
    needs: build-and-publish-api
    uses: AcmeTickets/.github/.github/workflows/Deploy API to Azure Container App.yml@main
    secrets: inherit
    with:
      image_tag: ${{ needs.build-and-publish-api.outputs.image_tag }}
      container_app_name: platform-api
      target_port: 5272

  build-and-publish-message:
    needs: test
    uses: AcmeTickets/.github/.github/workflows/Build and Publish Docker Image.yml@main
    secrets: inherit
    with:
      project_path: src/Message/Message.csproj
      dockerfile_path: src/Message/Dockerfile
      image_name: ghcr.io/acmetickets/platform-message

  deploy-message:
    needs: build-and-publish-message
    uses: AcmeTickets/.github/.github/workflows/Deploy Messaging to Azure Container App.yml@main
    secrets: inherit
    with:
      image_tag: ${{ needs.build-and-publish-message.outputs.image_tag }}
      container_app_name: platform-message
